
title: Whoami Execution With Discovery Flags
id: 9e940be7-f2f5-4f1f-bbcc-9fe0926ede95
status: experimental
description: Detects whoami.exe run with /all, /priv or /groups, which lists the current user's groups and privileges. Attackers use this right after initial access.
references:
    - https://attack.mitre.org/techniques/T1033/
author: Nourhan Elyamany
date: 2026-11-09
tags:
    - attack.discovery
    - attack.t1033
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
      - Image|endswith: '\whoami.exe'
      - OriginalFileName: 'whoami.exe'
    selection_cli:
      CommandLine|contains|windash: 
        - ' -all'
        - ' -priv'
        - ' -groups'
    condition: all of selection_*
falsepositives:
        - Administrators troubleshooting permissions or group membership
        - IT inventory, login or deployment scripts that collect user context
level: medium
